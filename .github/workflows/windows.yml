name: Windows build

on:
  push:
    branches: [main, "claude/**", "crowbar-pause"]
    tags: ["windows-*"]
  pull_request:
  workflow_dispatch:

# Tags windows-X.Y publish a release (a pre-release when the version has a suffix, windows-1.3-rc.1);
# the branch claude/crowbar-pause publishes test pre-releases windows-1.2.1-pause.N for Crowbar.
permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # GitHub's Windows image now ships its own C:/msys64; msys2-env.sh (sourced by build.sh and
      # the packaging scripts) would put it first on PATH and mix two MSYS2 runtimes: commands then
      # die with code 127. setup-msys2 already puts its CLANG64 first, so it is told to add nothing.
      MSYS2_ROOT: /nonexistent
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Some FSR SDK paths are longer than the default 260-character Windows limit, and the
      # FSR-Vulkan patches expect the files with LF endings, as they are stored.
      - name: Git settings
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false

      - uses: actions/checkout@v4

      # The MSYS2 CLANG64 toolchain and libraries listed in packaging/windows/README.md.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git patch zip
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p

      - name: Toolchain
        run: |
          clang --version | head -1
          cmake --version | head -1
          pkg-config --modversion sdl3 vulkan libavcodec

      - name: Build
        env:
          PS4RT_BUILD_JOBS: "2"
        run: |
          set +e
          bash build.sh
          code=$?
          echo "build.sh exit code: $code"
          tail -5 out/gpu-build.log 2>/dev/null
          ls -l out/*.exe out/gpu/*.exe 2>/dev/null
          exit $code

      - name: Build log
        if: always()
        shell: bash
        run: |
          if [ -f out/gpu-build.log ]; then
            grep -E "error|warning: .*\[-W" out/gpu-build.log | head -200 || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/gpu-build.log
          if-no-files-found: ignore

      # git and curl inside MSYS2 have hung on this runner, so the two header-only sources of
      # Ravn.exe are fetched here; build_ravn.sh skips its own download when they are present.
      - uses: actions/checkout@v4
        with:
          repository: webview/webview
          ref: "0.12.0"
          path: out/webview

      - name: WebView2 headers
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.3179.45 -OutFile out/webview2.zip -TimeoutSec 300
          Expand-Archive out/webview2.zip -DestinationPath out/webview2 -Force
          Get-ChildItem out/webview2/build/native/include

      - name: Build Ravn.exe
        timeout-minutes: 15
        run: bash packaging/windows/build_ravn.sh

      # A Windows CPython only installs the Pillow and iced-x86 wheels into the embedded Python.
      - uses: actions/setup-python@v5
        id: winpython
        with:
          python-version: "3.12"

      - name: Embeddable Python
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile out/python-embed.zip -TimeoutSec 300

      - name: Package
        timeout-minutes: 20
        env:
          WINPYTHON_WIN: ${{ steps.winpython.outputs.python-path }}
          RAVN_VERSION: ${{ startsWith(github.ref, 'refs/tags/windows-') && github.ref_name || (github.ref_name == 'crowbar-pause' && format('1.2.1-pause.{0}', github.run_number) || (github.ref_name == 'main' && 'dev' || format('test-{0}', github.run_number))) }}
        run: |
          export WINPYTHON=$(cygpath -u "$WINPYTHON_WIN")
          export RAVN_VERSION=${RAVN_VERSION#windows-}
          export RAVN_VERSION=${RAVN_VERSION//\//-}
          bash packaging/windows/package_ravn.sh

      - name: Upload the Ravn archive
        uses: actions/upload-artifact@v4
        with:
          name: ravn-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          compression-level: 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/windows-') || github.ref_name == 'crowbar-pause'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/*.zip | head -1)
          version=$(basename "$zip" .zip); version=${version#Ravn-windows-}
          tag="windows-$version"
          sha=$(cut -d' ' -f1 "$zip.sha256")
          pre=()
          [[ $version == *-* ]] && pre=(--prerelease)
          if [[ $GITHUB_REF_NAME == crowbar-pause ]]; then
            printf 'Test build of branch crowbar-pause (%s): pause from Crowbar'"'"'s Guide menu (crowbar-sdk 1.2).\n\nSHA-256: %s\n' "${GITHUB_SHA:0:7}" "$sha" > notes.md
          else
            printf 'SHA-256: %s\n' "$sha" > notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/*.zip.sha256 --clobber
          else
            gh release create "$tag" dist/*.zip dist/*.zip.sha256 --target "$GITHUB_SHA" "${pre[@]}" --title "$tag" --notes-file notes.md
          fi
